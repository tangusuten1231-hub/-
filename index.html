<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>宿根草ガーデンナビ</title>
  <meta name="description" content="位置情報からあなたの庭の気候を調べ、育つ宿根草・開花リレー・作業カレンダーを提案します。">
  <meta name="theme-color" content="#3f7d4e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>宿根草ガーデンナビ</span>
    </div>
    <button class="loc-chip" id="locChip" type="button" data-go="site">📍 場所を設定</button>
  </header>

  <main>
    <!-- 場所と気候 -->
    <section class="view" id="view-site" data-view="site">
      <div class="card">
        <h2>庭の場所</h2>
        <p class="hint">現在地か地名から、過去10年の気象データを調べて庭の気候を判定します。</p>
        <div class="row">
          <button class="btn primary" id="btnGeo" type="button">📍 現在地を使う</button>
        </div>
        <form class="search" id="searchForm">
          <input id="searchInput" type="search" placeholder="地名で検索（例：軽井沢、札幌市）" autocomplete="off" aria-label="地名で検索">
          <button class="btn" type="submit">検索</button>
        </form>
        <ul class="results" id="searchResults"></ul>
        <p class="status" id="siteStatus" role="status" aria-live="polite"></p>
      </div>
      <div id="climateBox"></div>
    </section>

    <!-- 植物を探す -->
    <section class="view" id="view-plants" data-view="plants" hidden>
      <div class="card filters" id="filters">
        <h2>植える場所の条件</h2>
        <div class="field">
          <span class="label">日当たり</span>
          <div class="seg" data-filter="sun">
            <button type="button" data-v="">すべて</button>
            <button type="button" data-v="full">日向</button>
            <button type="button" data-v="part">半日陰</button>
            <button type="button" data-v="shade">日陰</button>
          </div>
        </div>
        <div class="field">
          <span class="label">土の湿り気</span>
          <div class="seg" data-filter="moist">
            <button type="button" data-v="">すべて</button>
            <button type="button" data-v="dry">乾きぎみ</button>
            <button type="button" data-v="mid">普通</button>
            <button type="button" data-v="wet">湿りぎみ</button>
          </div>
        </div>
        <details class="more">
          <summary>さらに絞り込む</summary>
          <div class="field">
            <span class="label">草丈</span>
            <div class="seg" data-filter="height">
              <button type="button" data-v="">すべて</button>
              <button type="button" data-v="front">低い</button>
              <button type="button" data-v="middle">中くらい</button>
              <button type="button" data-v="back">高い</button>
            </div>
          </div>
          <div class="field">
            <label class="label" for="fMonth">開花月</label>
            <select id="fMonth" data-filter="month"></select>
          </div>
          <div class="field">
            <span class="label">花色</span>
            <div class="chips" id="fColor" data-filter="color"></div>
          </div>
          <div class="field">
            <label class="label" for="fQ">名前</label>
            <input id="fQ" type="search" data-filter="q" placeholder="例：サルビア">
          </div>
        </details>
        <label class="toggle"><input type="checkbox" id="fShowHard"> 育てにくい植物（△）も表示</label>
      </div>
      <p class="count" id="plantCount"></p>
      <div class="plant-list" id="plantList"></div>
    </section>

    <!-- マイガーデン -->
    <section class="view" id="view-garden" data-view="garden" hidden>
      <div id="gardenBox"></div>
    </section>

    <!-- 作業カレンダー -->
    <section class="view" id="view-tasks" data-view="tasks" hidden>
      <div id="tasksBox"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="メニュー">
    <button type="button" data-go="site" class="active"><span aria-hidden="true">🌍</span>場所と気候</button>
    <button type="button" data-go="plants"><span aria-hidden="true">🌼</span>植物を探す</button>
    <button type="button" data-go="garden"><span aria-hidden="true">🪴</span>マイガーデン<b class="badge" id="gardenBadge" hidden></b></button>
    <button type="button" data-go="tasks"><span aria-hidden="true">📅</span>作業暦</button>
  </nav>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
